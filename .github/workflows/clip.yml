name: AUTOCLIP AI V1.1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  clip:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Read video input
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > video_input.txt

      - name: Generate 3 clips
        run: |
          python clipper.py --url "$(cat video_input.txt)"

      - name: Upload clips
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autoclip-results
          path: output/
          if-no-files-found: error
          retention-days: 7
